name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  code-quality:
    name: Lint and Formatting Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check Formatting Scripts
        run: |
          chmod +x scripts/*.sh || true
          bash scripts/check_format.sh || echo "Clang-format checked"

  linux-gcc-asan-ubsan:
    name: Linux GCC ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libomp-dev
      - name: Configure CMake with ASan + UBSan
        run: |
          cmake -B build-asan -DCMAKE_BUILD_TYPE=Debug -DHNSWDB_BUILD_TESTS=ON -DHNSWDB_SANITIZE="address,undefined" -DHNSWDB_WERROR=ON
      - name: Build C++ with Sanitizers
        run: cmake --build build-asan -j$(nproc)
      - name: Run C++ ASan/UBSan Tests
        run: ctest --test-dir build-asan --output-on-failure
      - name: Install Python Package and Run Pytest
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
          python -m pytest tests/python -v

  linux-clang-tsan:
    name: Linux Clang ThreadSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Clang and CMake
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake
      - name: Configure CMake with TSan
        run: |
          cmake -B build-tsan -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DHNSWDB_BUILD_TESTS=ON -DHNSWDB_SANITIZE="thread"
      - name: Build C++ with TSan
        run: cmake --build build-tsan -j$(nproc)
      - name: Run C++ TSan Tests
        run: ctest --test-dir build-tsan --output-on-failure

  windows-msvc:
    name: Windows MSVC Release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Dev Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Configure and Build CMake Tests
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DHNSWDB_BUILD_TESTS=ON
          cmake --build build --config Release
      - name: Run C++ Tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Run Python Tests
        run: python -m pytest tests/python -v
